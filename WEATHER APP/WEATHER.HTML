<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER APP</title>
    <link rel="stylesheet" href="WEATHER.CSS">
</head>
<body>
   <header>
    <div id="title-bar">
        <h1>WEATHER</h1>
    </div>
</header>

<main>

    <input
        type="text"
        id="cityInput"
        placeholder="Enter city name"
    >

    <button id="searchBtn">SEARCH</button>

   <div id="city"></div>

<div id="Temperature"></div>

<div id="weather"></div>

<div id="humidity"></div>

<div id="wind"></div>

<div id="windDir"></div>

<div id="feelsLike"></div>

<div id="cloud"></div>

<div id="pressure"></div>

<div id="precip"></div>


<div id="uv"></div>

<div id="visibility"></div>

<div id="dewPoint"></div>
</main>
    <script src="WEATHER.JS"></script>
</body>
</html>
